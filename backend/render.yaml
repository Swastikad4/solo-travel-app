services:
  - type: web
    name: solotravel-api
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # Set this manually in Render dashboard — never commit secrets
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your Vercel frontend URL, e.g. https://solotravel.vercel.app
